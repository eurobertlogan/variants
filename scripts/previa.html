<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>prévia</title>
    <style>
      @font-face {
        font-family: "Geist";
        src: url("../public/fontes/geist-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
      }

      @font-face {
        font-family: "Geist Mono";
        src: url("../public/fontes/geist-mono-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
      }

      @page {
        size: 1200px 630px;
        margin: 0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        position: relative;
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: #0b0b0c;
        color: #f2efea;
        font-family: "Geist", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(242, 239, 234, 0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(242, 239, 234, 0.05) 1px, transparent 1px);
        background-size: 88px 88px;
        -webkit-mask-image: radial-gradient(ellipse 90% 75% at 50% 0%, #000 10%, transparent 78%);
        mask-image: radial-gradient(ellipse 90% 75% at 50% 0%, #000 10%, transparent 78%);
      }

      .mono {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 15px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .topo {
        position: absolute;
        top: 62px;
        left: 72px;
        right: 72px;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
      }

      .marca {
        font-size: 16px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }

      .marca .barra {
        color: #cdd67f;
      }

      .site {
        color: #9c9991;
      }

      h1 {
        position: absolute;
        top: 158px;
        left: 72px;
        width: 640px;
        margin: 0;
        font-size: 78px;
        font-weight: 500;
        line-height: 0.98;
        letter-spacing: -0.045em;
      }

      h1 .acento {
        color: #cdd67f;
      }

      .sub {
        position: absolute;
        top: 404px;
        left: 72px;
        width: 520px;
        margin: 0;
        color: #9c9991;
        font-size: 22px;
        line-height: 1.45;
      }

      .molduras {
        position: absolute;
        right: 72px;
        bottom: 96px;
        display: flex;
        align-items: flex-end;
        gap: 18px;
      }

      .moldura {
        position: relative;
        border: 1px solid rgba(242, 239, 234, 0.28);
      }

      .moldura::after {
        content: "";
        position: absolute;
        inset: 14%;
        border: 1px dashed #cdd67f;
        opacity: 0.85;
      }

      .moldura span {
        position: absolute;
        left: 0;
        bottom: -26px;
        color: #9c9991;
      }

      .quadrado {
        width: 150px;
        height: 150px;
      }

      .vertical {
        width: 100px;
        height: 178px;
      }

      .panorama {
        width: 214px;
        height: 54px;
      }

      .selo {
        position: absolute;
        bottom: 62px;
        left: 72px;
        color: #cdd67f;
      }

      .fio {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 112px;
        height: 1px;
        background: rgba(242, 239, 234, 0.075);
      }
    </style>
  </head>
  <body>
    <div class="topo">
      <div class="marca"><span class="barra">//</span> variants</div>
      <div class="mono site">robertlogan.cc</div>
    </div>

    <h1>uma foto, todos os <span class="acento">recortes</span></h1>
    <p class="sub">Feed, story, capa, miniatura e ícone no tamanho certo, com o assunto inteiro e a área da interface respeitada.</p>

    <div class="molduras">
      <div class="moldura quadrado"><span class="mono">1:1</span></div>
      <div class="moldura vertical"><span class="mono">9:16</span></div>
      <div class="moldura panorama"><span class="mono">4:1</span></div>
    </div>

    <div class="fio"></div>
    <div class="mono selo">// nada é enviado para nenhum servidor</div>
  </body>
</html>
