<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>variants: uma foto, todos os recortes, sem upload</title>
    <meta
      name="description"
      content="Solte uma imagem e receba feed, story, capa, miniatura e ícone no tamanho certo. O recorte segue o assunto e respeita a área que a interface cobre. Nada é enviado para servidor."
    />
    <meta name="theme-color" content="#0b0b0c" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="variants: uma foto, todos os recortes" />
    <meta
      property="og:description"
      content="Uma imagem mestre entra, cada formato que a internet pede sai. Recorte que persegue o assunto, zona segura respeitada, tudo no navegador."
    />
    <meta property="og:image" content="./previa.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="./previa.png" />
    <link rel="icon" href="./icone.svg" type="image/svg+xml" />
    <link rel="preload" href="./fontes/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./estilo.css" />
  </head>
  <body>
    <header class="topbar" id="topbar">
      <div class="container topo-interno">
        <a class="marca" href="./">
          <span class="barra">//</span>
          <span id="marca">variants</span>
        </a>
        <div class="idiomas mono">
          <button type="button" data-idioma="pt" aria-pressed="true">PT</button>
          <span aria-hidden="true">/</span>
          <button type="button" data-idioma="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="heroi">
        <p class="mono selo" id="selo"></p>
        <h1><span id="titulo"></span> <span class="acento" id="tituloAcento"></span></h1>
        <p class="sub" id="subtitulo"></p>
      </section>

      <section id="zona" class="zona" tabindex="0" role="button">
        <p class="mono formatos">jpg · png · webp</p>
        <p class="soltar" id="soltar"></p>
        <button type="button" id="escolher" class="botao principal"></button>
        <input id="entrada" type="file" accept="image/*" hidden />
      </section>

      <section id="painel" class="painel" hidden>
        <label class="opcao mono">
          <input type="checkbox" id="zonaToggle" checked />
          <span id="rotuloZona"></span>
        </label>
        <label class="opcao mono">
          <span id="rotuloQualidade"></span>
          <input id="qualidade" type="range" min="60" max="95" step="1" value="88" />
          <output id="qualidadeValor">88</output>
        </label>
        <div class="selecao mono">
          <button type="button" id="todos"></button>
          <span aria-hidden="true">/</span>
          <button type="button" id="nenhum"></button>
        </div>
      </section>

      <section id="grade" class="grade" hidden></section>

      <p id="vazio" class="vazio mono"></p>

      <div class="acoes">
        <span id="contador" class="mono contador"></span>
        <button type="button" id="baixarTudo" class="botao principal" disabled></button>
        <button type="button" id="limpar" class="botao fraco"></button>
      </div>

      <p id="aviso" class="aviso" hidden></p>

      <section class="explicacao">
        <h2 class="mono" id="comoFunciona"></h2>
        <p id="explicacao"></p>
      </section>
    </main>

    <footer>
      <div class="container">
        <p class="mono" id="rodape"></p>
      </div>
    </footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
